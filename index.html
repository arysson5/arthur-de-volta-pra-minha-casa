<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a2744" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Arthur" />
    <title>Arthur de volta pra minha casa</title>
    <link rel="icon" href="./icone-192.png" />
    <link rel="apple-touch-icon" href="./icone-192.png" />
    <style>
      html {
        font-size: clamp(15px, 4.8dvmin, 26px);
      }

      html,
      body,
      #jogo {
        margin: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: #0e1520;
        overflow: hidden;
        touch-action: none;
      }

      #jogo canvas {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100% !important;
      }

      #controles {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 30;
        pointer-events: none;
      }

      html.toque.jogando #controles {
        display: block;
      }

      #controles .lado {
        position: absolute;
        bottom: calc(0.35rem + env(safe-area-inset-bottom));
        pointer-events: none;
      }

      #controles .esq {
        left: calc(0.35rem + env(safe-area-inset-left));
        display: grid;
        grid-template-columns: 4.8rem 4.8rem;
        gap: 0.4rem;
      }

      #controles .esq [data-acao='baixo'] {
        grid-column: 1 / -1;
        justify-self: center;
      }

      #controles .dir {
        right: calc(0.35rem + env(safe-area-inset-right));
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.4rem;
      }

      #controles button {
        pointer-events: auto;
        touch-action: none;
        position: relative;
        display: grid;
        place-items: center;
        width: 4.8rem;
        height: 4.8rem;
        opacity: 0.92;
        margin: 0;
        padding: 0;
        border: 0.16rem solid #f0c43a;
        border-radius: 1.15rem;
        background: rgba(16, 24, 38, 0.55);
        color: #fff6e8;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 1.7rem;
        font-weight: 700;
        line-height: 1;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      #controles button.preso {
        transform: scale(0.94);
        background: rgba(240, 196, 58, 0.92);
        color: #1a120c;
      }

      #controles .sumir {
        width: 5.8rem;
        height: 5.8rem;
        overflow: hidden;
        font-size: 0.95rem;
        letter-spacing: 0.04em;
      }

      #controles .sumir::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(var(--carga, 1) * 100%);
        background: rgba(240, 196, 58, 0.5);
      }

      #controles .sumir span {
        position: relative;
        z-index: 1;
      }

      #controles .pulo {
        width: 6.4rem;
        height: 6.4rem;
        font-size: 1.2rem;
        background: rgba(240, 196, 58, 0.9);
        color: #1a120c;
      }

      #vire {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        box-sizing: border-box;
        padding:
          calc(24px + env(safe-area-inset-top))
          calc(24px + env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom))
          calc(24px + env(safe-area-inset-left));
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        background: #0e1520;
        color: #fff6e8;
        text-align: center;
      }

      .aparelho {
        width: 4.4rem;
        height: 7.4rem;
        border: 0.22rem solid #f0c43a;
        border-radius: 0.9rem;
        position: relative;
        animation: deitar 2.6s ease-in-out infinite;
      }

      .aparelho::before {
        content: '';
        position: absolute;
        top: 8px;
        left: 50%;
        width: 28px;
        height: 5px;
        margin-left: -14px;
        border-radius: 4px;
        background: #f0c43a;
      }

      .aparelho::after {
        content: '';
        position: absolute;
        right: 8px;
        bottom: 10px;
        left: 8px;
        height: 72px;
        border-radius: 6px;
        background: #1a2744;
      }

      .titulo {
        margin: 8px 0 0;
        font-family: 'Arial Black', Impact, 'Segoe UI', sans-serif;
        font-size: 2.4rem;
        line-height: 1;
        letter-spacing: 0.5px;
      }

      .dica {
        margin: 0;
        max-width: 16rem;
        font-family: 'Segoe UI', system-ui, sans-serif;
        font-size: 1.15rem;
        line-height: 1.35;
        color: #f0c43a;
      }

      @keyframes deitar {
        0%,
        18% {
          transform: rotate(0deg);
        }
        42%,
        68% {
          transform: rotate(-90deg);
        }
        100% {
          transform: rotate(0deg);
        }
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #vire {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="jogo"></div>
    <nav id="controles" aria-label="Controles">
      <div class="lado esq">
        <button type="button" data-acao="esquerda" aria-label="Esquerda">◄</button>
        <button type="button" data-acao="direita" aria-label="Direita">►</button>
        <button type="button" data-acao="baixo" aria-label="Agachar">▼</button>
      </div>
      <div class="lado dir">
        <button type="button" class="sumir" data-acao="invis" aria-label="Sumir"><span>SUMIR</span></button>
        <button type="button" class="pulo" data-acao="pulo" aria-label="Pular">PULO</button>
      </div>
    </nav>
    <div id="vire">
      <div class="aparelho" aria-hidden="true"></div>
      <p class="titulo">Deite a tela</p>
      <p class="dica">Vire o celular de lado para jogar.</p>
    </div>
    <script>
      document.getElementById('vire').addEventListener('click', function () {
        var tela = document.documentElement;
        var pedir = tela.requestFullscreen || tela.webkitRequestFullscreen;
        if (!pedir || !screen.orientation || !screen.orientation.lock) return;
        Promise.resolve(pedir.call(tela))
          .then(function () {
            return screen.orientation.lock('landscape');
          })
          .catch(function () {});
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
